name: Robotics runtime build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "scripts/**"
      - "ros2_ws/**"
      - ".github/workflows/runtime-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ROS 2 Jazzy runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: plastifind/robotics-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
